import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.sonarqube)
    id 'groovy'
    id 'jacoco'
    id 'java-test-fixtures'
    id 'maven-publish'
}

group = 'com.bbh.itss.beadle'
version = findProperty('artifactVersion') ?: '0.1.0-SNAPSHOT'
description = "Beadle-ProTech: the service between Beadle and ProTech, BBH's ServiceNow"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

base {
    archivesName = 'beadle-protech'
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}

configurations {
    testFixturesApi.extendsFrom implementation
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.apache.commons:commons-lang3'
    implementation libs.commons.collections4
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testFixturesApi libs.groovy
    testFixturesApi libs.groovy.json
    testFixturesApi platform(libs.spock.bom)
    testFixturesApi libs.spock.core
    testFixturesApi libs.spock.spring
    testFixturesApi libs.archunit.junit5
}

sonar {
    properties {
        property "sonar.host.url", "https://tools.bbh.com/sonar"
        property "sonar.token", System.getenv("SONAR_AUTH_TOKEN")
        property "sonar.projectKey", "Beadle-ProTech"
        property "sonar.projectName", "Beadle-ProTech"
        property "sonar.java.binaries", "build/classes/java/main"
        property "sonar.groovy.binaries", "build/classes/groovy/test"
        property "sonar.coverage.jacoco.xmlReportPaths", "build/reports/jacoco/test/jacocoTestReport.xml"
    }
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

testing {
    suites {
        configureEach {
            useJUnitJupiter()
            targets.configureEach {
                testTask.configure {
                    jvmArgs '-XX:+EnableDynamicAgentLoading'
                    testLogging {
                        events 'failed'
                        exceptionFormat = 'full'
                    }
                }
            }
        }

        test {
            targets.configureEach {
                testTask.configure {
                    finalizedBy tasks.named('jacocoTestReport')
                }
            }
        }

        if (file('src/regressionTest').isDirectory()) {
            register('regressionTest', JvmTestSuite) {
                dependencies {
                    implementation project()
                    implementation testFixtures(project())
                }
                targets.configureEach {
                    testTask.configure {
                        description = 'Runs the API end to end on H2 in Oracle mode with the demo adapters.'
                        shouldRunAfter tasks.named('test')
                        extensions.getByType(JacocoTaskExtension).enabled = false
                    }
                }
            }
        }
    }
}

tasks.named('check') {
    dependsOn testing.suites.withType(JvmTestSuite).matching { it.name != 'test' }
}

def coveredClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
    exclude '**/*Application.class'
}

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(coveredClasses)
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(coveredClasses)
    violationRules {
        rule {
            element = 'BUNDLE'
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = providers.gradleProperty('coverage.minimum').getOrElse('0.60') as BigDecimal
            }
        }
    }
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestCoverageVerification')
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

def nexusPublishProperty = version.toString().endsWith('SNAPSHOT') ? 'nexus.snapshotsUrl' : 'nexus.releasesUrl'
def nexusPublishUrl = findProperty(nexusPublishProperty)

publishing {
    publications {
        create('application', MavenPublication) {
            artifactId = 'beadle-protech'
            artifact tasks.named('bootJar')
        }
    }
    if (nexusPublishUrl) {
        repositories {
            maven {
                name = 'bbhNexus'
                url = uri(nexusPublishUrl)
                credentials(PasswordCredentials)
            }
        }
    }
}

tasks.named('publish') {
    dependsOn tasks.named('bootJar')
    doFirst {
        if (!nexusPublishUrl) {
            throw new GradleException("Set -P${nexusPublishProperty}=<url> to publish beadle-protech to the BBH Nexus.")
        }
    }
}
