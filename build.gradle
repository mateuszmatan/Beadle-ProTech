import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.sonarqube)
    id 'groovy'
    id 'jacoco'
    id 'java-test-fixtures'
    id 'maven-publish'
}

group = 'com.bbh.itss.beadle'
version = findProperty('artifactVersion') ?: '0.1.0-SNAPSHOT'
description = 'Beadle-ProTech: raises, reads and follows the production changes of Beadle in ProTech'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-parameters'
}

base {
    archivesName = 'beadle-protech'
}

dependencyManagement {
    imports {
        mavenBom SpringBootPlugin.BOM_COORDINATES
    }
}

configurations {
    testFixturesApi.extendsFrom implementation
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.apache.commons:commons-lang3'
    implementation libs.commons.collections4
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    testFixturesApi 'org.springframework.boot:spring-boot-starter-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testFixturesApi 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testFixturesApi libs.groovy
    testFixturesApi libs.groovy.json
    testFixturesApi platform(libs.spock.bom)
    testFixturesApi libs.spock.core
    testFixturesApi libs.spock.spring
    testFixturesApi libs.archunit.junit5
}

jacoco {
    toolVersion = libs.versions.jacoco.get()
}

def extraSuites = [smokeTest      : 'Starts the application and checks health and the key endpoints.',
                   regressionTest : 'Runs the most important journeys end to end on H2 in Oracle mode with the demo ProTech.',
                   performanceTest: 'Measures the p95 latencies of the key calls.']

testing {
    suites {
        configureEach {
            useJUnitJupiter()
            targets.configureEach {
                testTask.configure {
                    // C1 only: the test JVMs are short-lived, so they start Spring faster than with full JIT.
                    jvmArgs '-XX:+EnableDynamicAgentLoading', '-XX:TieredStopAtLevel=1'
                    systemProperty 'LOG_PATH', layout.buildDirectory.dir('logs').get().asFile.path
                    testLogging {
                        events 'failed'
                        exceptionFormat = 'full'
                    }
                }
            }
        }
        extraSuites.each { suiteName, text ->
            register(suiteName, JvmTestSuite) {
                dependencies {
                    implementation project()
                    implementation testFixtures(project())
                }
                targets.configureEach {
                    testTask.configure {
                        description = text
                        shouldRunAfter tasks.named('test')
                    }
                }
            }
        }
    }
}

def coveredClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
    exclude '**/*Application.class'
}

def lineCoverage = { BigDecimal minimum ->
    return {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                it.minimum = minimum
            }
        }
    }
}

tasks.named('test') {
    finalizedBy tasks.named('jacocoTestReport')
}

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(coveredClasses)
    reports.xml.required = true
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(coveredClasses)
    violationRules lineCoverage(0.60)
}

def suiteTasks = extraSuites.keySet().collect { tasks.named(it) }

def jacocoSuitesReport = tasks.register('jacocoSuitesReport', JacocoReport) {
    description = 'Coverage of the smoke, regression and performance suites together.'
    group = 'verification'
    mustRunAfter suiteTasks
    executionData.setFrom(suiteTasks.collect { it.map { task -> task.extensions.getByType(JacocoTaskExtension).destinationFile } })
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(coveredClasses)
    reports.xml.required = true
}

def jacocoSuitesCoverageVerification = tasks.register('jacocoSuitesCoverageVerification', JacocoCoverageVerification) {
    description = 'Fails the build when the suites cover less than 30% of the lines.'
    group = 'verification'
    mustRunAfter suiteTasks
    executionData.setFrom(jacocoSuitesReport.map { it.executionData })
    sourceDirectories.setFrom(sourceSets.main.allSource.srcDirs)
    classDirectories.setFrom(coveredClasses)
    violationRules lineCoverage(0.30)
}

tasks.named('check') {
    dependsOn suiteTasks, tasks.named('jacocoTestCoverageVerification'), jacocoSuitesReport, jacocoSuitesCoverageVerification
}

sonar {
    properties {
        property 'sonar.host.url', 'https://tools.bbh.com/sonar'
        property 'sonar.token', System.getenv('SONAR_AUTH_TOKEN')
        property 'sonar.projectKey', 'Beadle-ProTech'
        property 'sonar.projectName', 'Beadle-ProTech'
        property 'sonar.coverage.jacoco.xmlReportPaths', 'build/reports/jacoco/test/jacocoTestReport.xml'
    }
}

tasks.named('sonar') {
    dependsOn tasks.named('jacocoTestReport')
}

def nexusPublishProperty = version.toString().endsWith('SNAPSHOT') ? 'nexus.snapshotsUrl' : 'nexus.releasesUrl'
def nexusPublishUrl = findProperty(nexusPublishProperty)

publishing {
    publications {
        create('application', MavenPublication) {
            artifactId = 'beadle-protech'
            artifact tasks.named('bootJar')
        }
    }
    if (nexusPublishUrl) {
        repositories {
            maven {
                name = 'bbhNexus'
                url = uri(nexusPublishUrl)
                credentials(PasswordCredentials)
            }
        }
    }
}

tasks.named('publish') {
    dependsOn tasks.named('bootJar')
    doFirst {
        if (!nexusPublishUrl) {
            throw new GradleException("Set -P${nexusPublishProperty}=<url> to publish beadle-protech to the BBH Nexus.")
        }
    }
}
