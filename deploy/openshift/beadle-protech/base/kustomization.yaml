apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/name: beadle-protech
      app.kubernetes.io/part-of: beadle
resources:
  - deployment.yaml
  - service.yaml
configMapGenerator:
  - name: beadle-protech-config
    literals:
      - SPRING_PROFILES_ACTIVE=rd
      - BEADLE_GUI_URL=http://beadle:8081
      - PROTECH_URL=
      - PROTECH_POLL=PT1M
