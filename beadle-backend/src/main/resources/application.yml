spring:
  application:
    name: beadle
  config:
    import: classpath:bbh-devsecops-common.yml
  profiles:
    default: local
    group:
      rd: oracle
      qc: oracle
      prod: oracle
  jpa:
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8081}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    com.bbh.itss.dso: INFO

dso:
  gui:
    pages: changes, new-change, admin
  cybertrack:
    url: ${CYBERTRACK_URL:}
    token: ${CYBERTRACK_TOKEN:}
    project-key: ${CYBERTRACK_PROJECT_KEY:SCP}
    issue-type: ${CYBERTRACK_ISSUE_TYPE:Task}
  demo-data: false
---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${DB_URL:jdbc:h2:file:${BEADLE_DATA_DIR:${user.home}/bbh-devsecops/beadle}/beadle;MODE=Oracle;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=TRUE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: none
management:
  endpoint:
    health:
      show-details: always
dso:
  demo-data: ${BEADLE_DEMO_DATA:true}
---
spring:
  config:
    activate:
      on-profile: oracle
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
---
spring:
  config:
    activate:
      on-profile: rd
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
management:
  endpoint:
    health:
      show-details: always
logging:
  level:
    com.bbh.itss.dso: DEBUG
---
spring:
  config:
    activate:
      on-profile: qc
management:
  endpoint:
    health:
      show-details: always
---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
