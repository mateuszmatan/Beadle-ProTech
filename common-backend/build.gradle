description = 'Code both backends share: departments, error handling, use case transactions and the single page app forwarding'

apply plugin: 'java-library'

dependencies {
    api 'org.springframework.boot:spring-boot-starter-webmvc'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-liquibase'
    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-restclient'
    api 'org.apache.commons:commons-lang3'
    api libs.commons.collections4
    runtimeOnly 'com.h2database:h2'
    runtimeOnly 'com.oracle.database.jdbc:ojdbc11'
}

tasks.named('jar') {
    archiveBaseName = 'bbh-devsecops-common'
}
