pluginManagement {
  // Beadle builds inside the BBH network only: plugins and libraries come from the BBH Nexus.
  gradle.ext.bbhNexus = { RepositoryHandler repositories ->
    repositories.maven {
      url = uri('http://tools.bbh.com/nexus/content/groups/public')
      allowInsecureProtocol = true
    }
    ['gradle-plugins', 'maven-public', 'maven-central'].each { name ->
      repositories.maven { url = uri("https://tools.bbh.com/nexus/repository/$name/") }
    }
  }

  repositories {
    gradle.ext.bbhNexus(it)
  }

  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == 'org.springframework.boot') {
        useModule("org.springframework.boot:spring-boot-gradle-plugin:${requested.version}")
      }
    }
  }
}

dependencyResolutionManagement {
  repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
  repositories {
    gradle.ext.bbhNexus(it)
  }
}

rootProject.name = 'beadle-protech'
