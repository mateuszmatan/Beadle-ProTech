pluginManagement {
  def bbhNexus = 'https://tools.bbh.com/nexus'
  def bbhNexusHttp = 'http://tools.bbh.com/nexus'

  gradle.ext.bbhRepositories = { RepositoryHandler repositories, boolean plugins ->
    repositories.maven {
      url = uri("$bbhNexusHttp/content/groups/public")
      allowInsecureProtocol = true
    }
    repositories.maven { url = uri("$bbhNexus/repository/gradle-plugins/") }
    repositories.maven { url = uri("$bbhNexus/repository/maven-public/") }
    repositories.maven { url = uri("$bbhNexus/repository/maven-central/") }
    if (plugins) {
      repositories.gradlePluginPortal()
    }
    repositories.mavenCentral()
  }

  logger.lifecycle('Using BBH Nexus repository configuration for plugins and libraries.')

  repositories {
    gradle.ext.bbhRepositories(it, true)
  }

  resolutionStrategy {
    eachPlugin {
      if (requested.id.id == 'org.springframework.boot') {
        useModule("org.springframework.boot:spring-boot-gradle-plugin:${requested.version}")
      }
    }
  }
}

dependencyResolutionManagement {
  repositoriesMode = RepositoriesMode.FAIL_ON_PROJECT_REPOS
  repositories {
    gradle.ext.bbhRepositories(it, false)
  }
}

rootProject.name = 'beadle-protech'
